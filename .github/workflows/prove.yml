# Prove automatiche di Dettami: girano a ogni push e a ogni pull request.
# Nessun segreto: niente chiave di firma, niente chiave Groq, nessuna chiamata a servizi esterni.
name: Prove

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Prove (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 è il Python della versione per Mac, 3.14 quello della versione per Windows
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve la storia: test_pacchetto.py confronta con il codice della 1.3.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Librerie
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest cryptography pyflakes playwright
          python -m playwright install --with-deps chromium

      - name: Pyflakes
        run: python -m pyflakes *.py mac/*.py prove/*.py

      - name: Test (pytest, compreso il controllo del pacchetto di aggiornamento)
        run: python -m pytest -q

      - name: Simulazione Windows
        run: python prove/simula_windows.py

      - name: Dashboard in Chromium
        run: python prove/prova_dashboard.py

      - name: Simulazione Mac
        run: python prove/simula_mac.py base

      - name: Simulazione permessi Mac
        run: python prove/simula_mac.py permessi

      - name: Script PowerShell
        run: python prove/controlla_ps1.py installer/installa.ps1 installer/disinstalla.ps1 chiave.ps1

      - name: Script Mac (shellcheck)
        run: shellcheck -s bash -S warning mac/*.command

      - name: Risultati delle prove
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prove-output-${{ matrix.python }}
          path: prove/_output/
          if-no-files-found: ignore
          retention-days: 7
